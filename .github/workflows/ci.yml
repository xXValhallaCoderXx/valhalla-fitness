name: CI

# Gate the production branch on static checks, behavior tests, a production
# build, PWA integrity, and bundle budgets. Production promotion happens only
# after these checks and the protected release-database workflow succeed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  database:
    name: Database migrations & contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec supabase start

      - run: pnpm db:migrate:local

      - run: pnpm db:test

      - if: always()
        run: pnpm exec supabase stop --no-backup

  static:
    name: Static & architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm architecture:check

      - run: pnpm docs:check

      - run: pnpm db:contract:check

  unit-build:
    name: Unit, build, PWA & budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - run: pnpm pwa:verify

      - run: pnpm bundle:check
